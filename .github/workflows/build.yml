name: Build
run-name: Build ${{ inputs.board || 'rock-5b-plus' }} ${{ inputs.suites }} ${{ inputs.flavors }}

on:
  # Temporary: run once on the development branch before it is merged
  push:
    branches:
      - claude/vibrant-rubin-yjksxz
  workflow_dispatch:
    inputs:
      board:
        description: Board to build images for
        type: string
        default: rock-5b-plus
      suites:
        description: Space separated suites, leave empty for every compatible suite
        type: string
        default: ""
      flavors:
        description: Space separated flavors, leave empty for server and desktop
        type: string
        default: ""
  workflow_call:
    inputs:
      board:
        type: string
        default: rock-5b-plus
      suites:
        type: string
        default: ""
      flavors:
        type: string
        default: ""

jobs:
  config:
    runs-on: ubuntu-24.04
    name: Create matrix
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      kernels: ${{ steps.matrix.outputs.kernels }}
      has_kernels: ${{ steps.matrix.outputs.has_kernels }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create matrix
        id: matrix
        env:
          BOARD: ${{ inputs.board || 'rock-5b-plus' }}
          SUITES: ${{ inputs.suites }}
          FLAVORS: ${{ inputs.flavors }}
        run: .github/scripts/matrix.sh "${BOARD}" "${SUITES}" "${FLAVORS}" | tee -a "$GITHUB_OUTPUT"

  rootfs:
    runs-on: ubuntu-24.04
    name: Build rootfs ${{ matrix.suite }} ${{ matrix.flavor }}
    timeout-minutes: 180
    needs: [config]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build host
        uses: ./.github/actions/setup

      - name: Build
        run: sudo ./build.sh --suite=${{ matrix.suite }} --flavor=${{ matrix.flavor }} --rootfs-only

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ matrix.version }}-preinstalled-${{ matrix.flavor }}-arm64-rootfs
          path: ./build/ubuntu-${{ matrix.version }}-preinstalled-${{ matrix.flavor }}-arm64.rootfs.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  kernel:
    runs-on: ${{ matrix.runner }}
    name: Build kernel ${{ matrix.suite }}
    timeout-minutes: 240
    needs: [config]
    if: needs.config.outputs.has_kernels == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.kernels) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build host
        uses: ./.github/actions/setup

      - name: Build
        run: sudo ./build.sh --suite=${{ matrix.suite }} --kernel-only

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.suite }}
          path: ./build/kernel-${{ matrix.suite }}/linux-*.deb
          if-no-files-found: error
          retention-days: 3

  image:
    runs-on: ubuntu-24.04
    name: Build image ${{ matrix.suite }} ${{ matrix.flavor }}
    timeout-minutes: 120
    needs: [config, rootfs, kernel]
    # The kernel job is skipped when only mainline suites are built
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build host
        uses: ./.github/actions/setup

      - name: Download rootfs
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-${{ matrix.version }}-preinstalled-${{ matrix.flavor }}-arm64-rootfs
          path: ./build/

      - name: Download kernel
        if: matrix.kernel_type == 'vendor'
        uses: actions/download-artifact@v8
        with:
          name: kernel-${{ matrix.suite }}
          path: ./build/kernel-${{ matrix.suite }}/

      - name: Build
        run: sudo ./build.sh --board=${{ matrix.board }} --suite=${{ matrix.suite }} --flavor=${{ matrix.flavor }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ matrix.version }}-preinstalled-${{ matrix.flavor }}-arm64-${{ matrix.board }}
          path: ./images/ubuntu-${{ matrix.version }}-preinstalled-${{ matrix.flavor }}-arm64-${{ matrix.board }}.*
          if-no-files-found: error
          compression-level: 0
