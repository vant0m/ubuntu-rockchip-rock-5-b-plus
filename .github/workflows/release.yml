name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to create, for example v2.5.0
        type: string
        required: true
      suites:
        description: Space separated suites, leave empty for every compatible suite
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      board: rock-5b-plus
      suites: ${{ inputs.suites }}

  release:
    name: Create draft release
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: ubuntu-*-preinstalled-*-arm64-rock-5b-plus
          path: ./images/
          merge-multiple: true

      # GitHub refuses release assets larger than 2 GiB, which the desktop
      # images exceed once the snaps are seeded
      - name: Split large images
        working-directory: ./images
        run: |
          for image in *.img.xz; do
              if [ "$(stat -c %s "${image}")" -gt 2147483648 ]; then
                  split --bytes=2000M --numeric-suffixes=1 --suffix-length=1 "${image}" "${image}.part"
                  rm "${image}"
              fi
          done
          ls -l

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          body: |
            Ubuntu images for the Radxa ROCK 5B+, see the README for the supported releases.

            Images larger than 2 GiB are split in parts because of the GitHub size limit. Join them before writing the image, the `.sha256` file is for the joined image:

            ```bash
            cat ubuntu-26.04-preinstalled-desktop-arm64-rock-5b-plus.img.xz.part* > ubuntu-26.04-preinstalled-desktop-arm64-rock-5b-plus.img.xz
            sha256sum -c ubuntu-26.04-preinstalled-desktop-arm64-rock-5b-plus.img.xz.sha256
            ```
          files: images/*
