name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to create, for example v2.5.0
        type: string
        required: true
      suites:
        description: Space separated suites, leave empty for every compatible suite
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      board: rock-5b-plus
      suites: ${{ inputs.suites }}

  release:
    name: Create draft release
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: ubuntu-*-preinstalled-*-arm64-rock-5b-plus
          path: ./images/
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            images/*.img.xz
            images/*.img.xz.sha256
